<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup C – Semi-realistisch</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body style="--bg:#c9d8e4"><div id="loading">Lade Szene …</div>
<script type="module">
import * as THREE from 'three';
import { loadScene, buildTerrain, buildSkirt, buildBuildings, buildRoads, buildWater, treePositions, heightAt, groundH, setupView, overlay, run, addMarker, CAT, hex } from './common.js';
const S = await loadScene();
document.getElementById('loading').remove();
const top = new URLSearchParams(location.search).get('view') === 'top';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 5, 30000);

// Himmel als Verlaufskugel, dient auch als Umgebungs-Map für Spiegelungen (Wasser)
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: {},
  vertexShader: 'varying vec3 v; void main(){ v = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'varying vec3 v; void main(){ float t = clamp(v.y*1.6,0.,1.); vec3 c = mix(vec3(.86,.89,.92), vec3(.36,.56,.82), pow(t,.6)); gl_FragColor = vec4(c,1.); }' });
const sky = new THREE.Mesh(new THREE.SphereGeometry(15000, 32, 16), skyMat); scene.add(sky);
const pm = new THREE.PMREMGenerator(renderer); const envScene = new THREE.Scene(); envScene.add(sky.clone());
scene.environment = pm.fromScene(envScene, 0.02).texture;
if (!top) scene.fog = new THREE.FogExp2('#cfd9e2', 0.00022);

// Geländetextur: Landnutzung je 5-m-Zelle, mit Rauschen und Ackerstreifen (2,5 m/Pixel)
const n = S.landuse.n, R = 2, cv = document.createElement('canvas'); cv.width = cv.height = n * R;
const g = cv.getContext('2d'), id = g.createImageData(n * R, n * R), d = id.data;
const base = {
  [CAT.unbekannt]: '#7d8d4f', [CAT.wasser]: '#4a5a4e', [CAT.wald]: '#2f4a26', [CAT.gebuesch]: '#4d6232', [CAT.wiese]: '#7f9a4a',
  [CAT.acker]: '#a7955f', [CAT.obst_garten]: '#6f8a3f', [CAT.park_sport]: '#6f9a44', [CAT.wohnen]: '#8f8a78', [CAT.gewerbe]: '#8a8680',
  [CAT.industrie]: '#7f7d7a', [CAT.fels]: '#8b8173', [CAT.bahn]: '#6b6258', [CAT.oeffentlich]: '#8d8a7c' };
const B = Object.fromEntries(Object.entries(base).map(([k, v]) => [k, hex(v)]));
let s = 9; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
for (let y = 0; y < n * R; y++) for (let x = 0; x < n * R; x++) {
  const k = S.lu[((y / R) | 0) * n + ((x / R) | 0)], c = B[k];
  let f = 0.88 + rnd() * 0.24;
  if (k === CAT.acker) f *= 0.9 + 0.12 * Math.sin((x + y * 0.35) * 0.9);
  if (k === CAT.wohnen && rnd() < 0.35) f *= 1.25; // Gärten/Pflaster gemischt
  const i = (y * n * R + x) * 4; d[i] = c[0] * 255 * f; d[i + 1] = c[1] * 255 * f; d[i + 2] = c[2] * 255 * f; d[i + 3] = 255;
}
g.putImageData(id, 0, 0); g.filter = 'blur(1px)'; g.drawImage(cv, 0, 0);
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
const terr = buildTerrain(S, { step: 10, color: () => [1, 1, 1] });
const tm = new THREE.Mesh(terr, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
tm.receiveShadow = true; scene.add(tm);
scene.add(new THREE.Mesh(buildSkirt(S, 60), new THREE.MeshStandardMaterial({ color: '#4b3f33', side: THREE.DoubleSide, roughness: 1 })));
const water = new THREE.Mesh(buildWater(S),
  new THREE.MeshPhysicalMaterial({ color: '#2f4f5c', roughness: 0.08, metalness: 0.0, transparent: true, opacity: 0.92, envMapIntensity: 1.2 }));
water.receiveShadow = true; scene.add(water);

// Gebäude: Putzfarben und Dachziegel mit Variation, Satteldächer
const hsh = (b) => { let h = 0; for (let i = 0; i < 6 && i < b.r.length; i++) h = (h * 31 + (b.r[i] * 10 | 0)) | 0; return Math.abs(h); };
const walls = ['#e8e1d3', '#ddd3c0', '#efe9dc', '#d9cdb8', '#e6dccb', '#cfc6b6'].map(hex);
const roofs = ['#8e3b2c', '#7a3326', '#5b5552', '#9b4a35', '#474443', '#6e2f25'].map(hex);
const bm = new THREE.Mesh(buildBuildings(S, { minH: 3, gable: true,
  wallColor: b => /industrial|commercial|retail|warehouse/.test(b.c) ? hex('#b9b6b0') : walls[hsh(b) % walls.length],
  roofColor: b => b.g ? roofs[hsh(b) % roofs.length] : hex('#6c6a66') }),
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 }));
bm.castShadow = bm.receiveShadow = true; scene.add(bm);
// Straßen: Asphalt, Wege in Kies, Bahn als Schotterbett
const rm = new THREE.Mesh(buildRoads(S, { lift: 0.5,
  width: r => r.c === 'steps' ? 0 : r.w,
  color: r => hex(r.c === 'standard_gauge' ? '#5d564f' : ['footway', 'path', 'track', 'cycleway'].includes(r.c) ? '#a79c86' : '#56585b') }),
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 }));
rm.receiveShadow = true; scene.add(rm);

// Bäume: Stamm + Krone (zwei Kugeln), dicht, mit Größen- und Farbvariation
const tp = treePositions(S, 0.75, 11);
const crown = new THREE.IcosahedronGeometry(1, 1);
const cm = new THREE.InstancedMesh(crown, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: false }), tp.length * 2);
const tr = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.4, 1, 5).translate(0, 0.5, 0), new THREE.MeshStandardMaterial({ color: '#4a3826' }), tp.length);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3(), c = new THREE.Color();
let j = 0;
tp.forEach(([x, y, k], i) => {
  const h = groundH(S, x, y), size = 3.2 + k * 3.2 + rnd() * 2, hh = size * (1.6 + rnd() * 0.6);
  m4.compose(v.set(x, h - 0.5, -y), q.identity(), sc.set(size * 0.25, hh * 0.55, size * 0.25)); tr.setMatrixAt(i, m4);
  for (let p = 0; p < 2; p++) {
    const r = size * (p ? 0.7 : 1);
    m4.compose(v.set(x + (rnd() - 0.5) * size * 0.6, h + hh * (p ? 0.95 : 0.7), -y + (rnd() - 0.5) * size * 0.6), q.identity(), sc.set(r, r * 0.85, r));
    cm.setMatrixAt(j, m4); cm.setColorAt(j, c.setHSL(0.22 + rnd() * 0.08, 0.35 + rnd() * 0.2, 0.17 + rnd() * 0.09)); j++;
  }
});
cm.castShadow = tr.castShadow = true; cm.receiveShadow = true; scene.add(cm, tr);

scene.add(new THREE.HemisphereLight('#cfe0f2', '#4b5a37', 0.9));
const sun = new THREE.DirectionalLight('#ffe7c4', 3.2); sun.position.set(-1800, 1500, -1400); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -2600, right: 2600, top: 2600, bottom: -2600, near: 100, far: 7000 });
sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.5; scene.add(sun);

scene.userData.S = S;
const ground = (x, y) => groundH(S, x, y);
addMarker(scene, S, ground);
const controls = setupView(renderer, camera, S);
const hud = overlay(S, 'C · Semi-realistisch', 'Glattes Gelände (10-m-Raster) mit Landnutzungs-Textur, Putz- und Ziegelfarben, dichte Bewaldung, spiegelndes Wasser, Dunst und Abendsonne. Am nächsten an der Wirklichkeit, braucht aber die genauesten Daten (DGM1, LoD2, Orthofotos).', 'c-semirealistisch');
run(renderer, scene, camera, controls, ground, hud);
</script></body></html>
